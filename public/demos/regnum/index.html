/* Раскладка СТРАНИЦЫ демо. Все компоненты и цвета — в ds/ (токены → компоненты); тут только сетка и места. */
#root{position:relative; z-index:1}
.app{display:grid; grid-template-columns:268px 1fr; gap:22px; max-width:1360px; margin:0 auto; padding:18px 22px 60px}
.top{grid-column:1 / -1; display:flex; align-items:center; gap:14px}
.promos{grid-template-columns:repeat(4, minmax(0, 1fr)); margin-top:0}
.games-sec{display:flex; flex-direction:column; gap:16px; scroll-margin-top:20px}
.games-bar{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.games-count{font:var(--t-caption); letter-spacing:var(--tr-caption); color:var(--faint)}
.links{display:flex; gap:14px; white-space:nowrap}
.back{font:var(--t-caption); letter-spacing:var(--tr-caption); color:var(--faint)} .back:hover{color:var(--metal)}
.back.lab{color:var(--metal); text-shadow:0 0 10px var(--glow-metal)}
.side .in{padding:18px 12px}
.main{display:flex; flex-direction:column; gap:22px; min-width:0; view-transition-name:rg-page; container:main / inline-size}
.row{display:grid; grid-template-columns:330px 1fr; gap:22px}
.stats{display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:auto auto 1fr; gap:16px}
.span3{grid-column:1 / -1}
.top-burger{display:none} .side-veil{display:none}
/* секции ниже первого экрана: браузер не рисует их (и не крутит их анимации), пока они вне экрана */
.main > .row, .main > .wallets, .main > .games-sec, .side{content-visibility:auto; contain-intrinsic-size:auto 600px}
.wallets{display:grid; grid-template-columns:repeat(3,1fr); gap:16px}
.games{display:grid; grid-template-columns:repeat(4,1fr); gap:16px}
footer.foot{position:relative; z-index:1; max-width:1360px; margin:0 auto; padding:0 22px 40px; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; font:var(--t-caption); letter-spacing:var(--tr-caption); color:var(--faint)}
footer.foot a{text-decoration:underline; transition:color var(--dur-fast) var(--ease)} footer.foot a:hover{color:var(--metal)}
/* сетки контента меряют ширину САМОЙ колонки .main (container query), а не окна: панель свёрнута — блоки шире, раскладка
   та же, что дала бы такая ширина. Пороги = прежние брейкпоинты окна, пересчитанные на колонку (окно 1100 → .main 766, 640 → 612) */
@container main (max-width: 766px){ .games{grid-template-columns:repeat(3,1fr)} .row{grid-template-columns:1fr} }
@container main (max-width: 700px){ .promos{grid-template-columns:1fr 1fr} }
@container main (max-width: 612px){ .games{grid-template-columns:repeat(2,1fr)} .wallets{grid-template-columns:1fr} .stats{grid-template-columns:1fr 1fr} }
/* ── панель в иконки (rail) — только на десктопе; на ≤900 px панель — шторка, rail не действует ── */
.side-tog{display:none}
@media (min-width: 901px){
  .side{view-transition-name:rg-side}
  /* кнопка свернуть — в шапке слева от логотипа (на телефоне на этом месте бургер шторки) */
  .side-tog{display:grid; place-items:center; width:40px; height:40px; flex:none; border-radius:10px; margin-right:-2px;
    box-shadow:inset 0 0 0 1px color-mix(in oklch, var(--metal-dim) 35%, transparent); transition:background var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease)}
  .side-tog:hover{background:var(--panel-hi); box-shadow:inset 0 0 0 1px var(--metal-dim)} .side-tog:focus-visible{outline:2px solid var(--metal); outline-offset:2px}
  .side-tog .ico{width:20px; height:20px; transition:transform var(--dur) var(--ease)}
  .app.rail{grid-template-columns:76px 1fr}
  .app.rail .side .in{padding:12px 8px}
  .app.rail .side-tog .ico{transform:scaleX(-1)}
  .app.rail .nl, .app.rail .side .flourish, .app.rail .nav-soon, .app.rail .grow .badge{display:none}
  .app.rail .nav a{justify-content:center; gap:0; padding:7px 0}
  .app.rail .sub-h{justify-content:center; margin:16px 0 8px}
  .app.rail .glist{align-items:center}
  .app.rail .grow{justify-content:center; padding:5px; gap:0; border-radius:10px}
  .app.rail .grow .em{width:34px; height:34px}
}
/* шапка на узком десктопе: без имени, подписи «Balance» и служебных ссылок (они есть в подвале) — иначе поиск сжимался в ноль
   и его текст наезжал на баланс; ещё уже — поиск своей строкой, как на телефоне */
@media (min-width: 901px) and (max-width: 1199px){ .um-name, .bc-k, .links{display:none} }
@media (min-width: 901px) and (max-width: 1060px){ .top{flex-wrap:wrap} .top .search{order:5; flex-basis:100%} .top .logo{margin-right:auto} }
html[data-vt=rail]::view-transition-group(*){animation-duration:.34s; animation-timing-function:var(--ease)}
html[data-vt=rail]::view-transition-old(rg-page), html[data-vt=rail]::view-transition-old(rg-side){animation:rg-x-out .34s var(--ease) both}
html[data-vt=rail]::view-transition-new(rg-page), html[data-vt=rail]::view-transition-new(rg-side){animation:rg-x-in .34s var(--ease) both}
@keyframes rg-x-out{to{opacity:0}} @keyframes rg-x-in{from{opacity:0}}
@media (max-width: 900px){
  .app{grid-template-columns:1fr; padding:14px 14px 40px; gap:16px}

  .side{position:fixed; z-index:60; top:0; left:0; bottom:0; width:min(300px, 84vw); padding:12px; overflow-y:auto; overscroll-behavior:contain;
    background:var(--bg); transform:translateX(-102%); transition:transform .35s var(--ease), visibility 0s .35s; visibility:hidden; content-visibility:visible}
  .side.open{transform:none; visibility:visible; transition:transform .35s var(--ease)}
  .side-veil{display:block; position:fixed; inset:0; z-index:55; background:oklch(0% 0 0 / .55); opacity:0; pointer-events:none; transition:opacity .3s var(--ease)}
  .side-veil.on{opacity:1; pointer-events:auto}
  html.menu-open{overflow:hidden}
  .top{flex-wrap:wrap; gap:10px} .top .search{order:5; flex-basis:100%} .um-name{display:none} .top .logo{margin-right:auto}
}
@media (max-width: 640px){
  .top .seg{display:none} .bc-k{display:none} .links{display:none} .um-bell{display:none} .top{gap:8px}
  .top .logo svg{display:none} .balance-chip{padding:0 5px 0 10px; gap:8px} .top .logo{margin-right:auto}

  .stats .stat:first-child{grid-column:1 / -1} .links .back:not(.lab){display:none}
}
</style>

const routeOf = () => { const r = location.hash.replace(/^#\/?/, ''); return ROUTES.some(([k, , , closed]) => k === r && !closed) ? r : 'hall'; };

const railStart = () => { try { const v = localStorage.getItem(RAIL_KEY); if (v !== null) return v === '1'; } catch {} return matchMedia('(min-width: 901px) and (max-width: 1199px)').matches; };
function App() {
  const [q, setQ] = useState('');
  const route = useRoute();
  const [menu, setMenu] = useState(false);
  const [rail, setRail] = useState(railStart);
  const toggleRail = () => {
    document.documentElement.dataset.vt = 'rail';   // свой переход: панель и контент плавно меняют ширину, без «смены страницы»
    const t = viewTransition(() => setRail((r) => { try { localStorage.setItem(RAIL_KEY, r ? '0' : '1'); } catch {} return !r; }));
    (t ? t.finished : Promise.resolve()).finally(() => { delete document.documentElement.dataset.vt; });
  };
  React.useEffect(() => { setMenu(false); }, [route]);
  React.useEffect(() => {   // меню открыто: страница под ним не прокручивается, Esc закрывает
    document.documentElement.classList.toggle('menu-open', menu);
    const k = (e) => { if (e.key === 'Escape') setMenu(false); }; addEventListener('keydown', k); return () => removeEventListener('keydown', k);
  }, [menu]);
  return html`<${React.Fragment}>
    <${Dust}/>
    <div class=${'app' + (rail ? ' rail' : '')}>
      <${Top} q=${q} setQ=${setQ} route=${route} menu=${menu} setMenu=${setMenu} rail=${rail} toggleRail=${toggleRail}/>
      <${Side} route=${route} open=${menu} close=${() => setMenu(false)}/>
      <main class="main" key=${route}>
        ${route === 'hall' ? html`<${Hall}/>` : route === 'casino' ? html`<${Casino}/>`
          : route === 'sports' ? html`<${Sports}/>` : html`<${Promos}/>`}
      </main>
    </div>
    <footer class="foot"><span>Regnum is a fictional brand — UI case study by Elocate Studio. <a href="lab/index.html">Design system lab</a> · <a href="/#work">Elocate</a></span><span>Icons: <a href="https://phosphoricons.com">Phosphor</a> (MIT) · portraits: Lorelei by Lisa Wischofsky (CC0) · payment marks: Simple Icons (CC0), trademarks of their owners · Play responsibly · 18+</span></footer>
  <//>`;
}

createRoot(document.getElementById('root')).render(html`<${App}/>`);
// интерфейс отрисован → последний этап загрузки; после ухода экрана — замер качества графики
requestAnimationFrame(() => requestAnimationFrame(() => window.__rgStep && window.__rgStep('app')));
addEventListener('rg:loaded', () => autoQuality(), { once: true });
</script>
<!-- FPS у курсора: localhost — всегда, прод — ?fps=1 или Shift+F -->
<script type="module" src="/demos/_shared/fps.js"></script>
</body>
