<!doctype html>
<html lang="en" data-theme="noir">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regnum — royal casino dashboard · Elocate Studio</title>
<meta name="description" content="A royal casino dashboard UI — gamedev case study demo by Elocate Studio. Fictional brand.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "framer-motion": "https://esm.sh/framer-motion@11.11.17?external=react,react-dom",
    "htm": "https://esm.sh/htm@3.1.1"
  }
}
</script>
<!-- тема/подкрутки из лабы — до первой отрисовки, чтобы не мигало -->
<script>try{var L=JSON.parse(localStorage.getItem('regnum-ds-look-v2'));var q=new URLSearchParams(location.search).get('theme');if(q)L={theme:q,vars:{}};if(L){document.documentElement.dataset.theme=L.theme||'noir';for(var k in(L.vars||{}))document.documentElement.style.setProperty(k,L.vars[k]);}}catch(e){}</script>
<link rel="stylesheet" href="ds/tokens.css">
<link rel="stylesheet" href="ds/components.css">
<style>
/* Раскладка СТРАНИЦЫ демо. Все компоненты и цвета — в ds/ (токены → компоненты); тут только сетка и места. */
#root{position:relative; z-index:1}
.app{display:grid; grid-template-columns:268px 1fr; gap:22px; max-width:1360px; margin:0 auto; padding:18px 22px 60px}
.top{grid-column:1 / -1; display:flex; align-items:center; gap:18px}
.auth{display:flex; align-items:center; gap:14px; font-weight:700; color:var(--muted)}
.links{display:flex; gap:14px; white-space:nowrap}
.back{font-size:12px; color:var(--faint)} .back:hover{color:var(--metal)}
.back.lab{color:var(--metal); text-shadow:0 0 10px var(--glow-metal)}
.side .in{padding:18px 12px}
.crest-top{display:flex; justify-content:center; margin:-4px 0 12px; opacity:.8}
.crest-top path:first-child{stroke:var(--metal-dim)} .crest-top path:last-child{fill:var(--metal)}
.main{display:flex; flex-direction:column; gap:22px; min-width:0}
.hero .in{display:grid; grid-template-columns:1.15fr .85fr; align-items:center; gap:10px; padding:34px 36px; min-height:330px; overflow:hidden;
  background:radial-gradient(60% 90% at 82% 40%, color-mix(in oklch, var(--accent-deep) calc(55% * var(--glow)), transparent), transparent 65%),
    radial-gradient(40% 60% at 82% 40%, var(--glow-metal-soft), transparent 70%),
    radial-gradient(70% 100% at 0% 0%, color-mix(in oklch, var(--magic) 18%, transparent), transparent 60%), var(--panel)}
.hero .in > div, .hero .wheel-wrap{position:relative; z-index:1}
.hero h1{margin:12px 0 6px; font:800 clamp(30px,4vw,48px)/1.05 var(--f-head); letter-spacing:.01em; text-shadow:0 0 30px var(--glow-metal-soft)}
.hero h1 b{filter:var(--tf-glow)}
.hero .guilloche{position:absolute; right:3%; top:50%; width:min(560px,62%); transform:translateY(-50%)}
@media (max-width: 900px){ .hero .guilloche{right:50%; top:auto; bottom:-10%; transform:translateX(50%); width:520px} }
.hero p{margin:0 0 18px; color:var(--muted); max-width:440px}
.pay{display:flex; gap:8px; margin-bottom:22px}
.pay i{display:grid; place-items:center; width:34px; height:34px; border-radius:50%; font:800 10px/1 var(--f-body); font-style:normal; color:var(--ink);
  background:var(--metal-tex), color-mix(in oklch, var(--b) calc(100% * min(var(--art-c), 1)), var(--panel-hi)); box-shadow:inset 0 0 0 1px oklch(100% 0 0 / .14)}   /* бренд-цвета гасятся той же ручкой, что обложки игр */
.castle{position:absolute; right:2%; bottom:-2%; width:min(520px,58%); opacity:.08; pointer-events:none; fill:var(--metal);
  -webkit-mask-image:linear-gradient(180deg, transparent, #000 45%); mask-image:linear-gradient(180deg, transparent, #000 45%)}
.row{display:grid; grid-template-columns:330px 1fr; gap:22px}
.profile .in{display:flex; flex-direction:column; align-items:center; justify-content:center; padding:26px 22px 20px; text-align:center}
.profile h3{margin:10px 0 2px; font:700 20px/1.2 var(--f-head)}
.profile .rank{font-size:13px; color:var(--metal)}
.profile .ptabs{margin-top:18px}
.stats{display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:auto auto 1fr; gap:16px}
.span3{grid-column:1 / -1}
.wallets{display:grid; grid-template-columns:repeat(3,1fr); gap:16px}
.games{display:grid; grid-template-columns:repeat(4,1fr); gap:16px}
footer.foot{position:relative; z-index:1; max-width:1360px; margin:0 auto; padding:0 22px 40px; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; font-size:12px; color:var(--faint)}
footer.foot a{text-decoration:underline}
@media (max-width: 1100px){ .games{grid-template-columns:repeat(3,1fr)} .row{grid-template-columns:1fr} }
@media (max-width: 900px){
  .app{grid-template-columns:1fr; padding:14px 14px 40px; gap:16px}
  .side{order:2} .main{order:1}
  .top{flex-wrap:wrap; gap:12px} .field{order:3; flex-basis:100%} .auth .lnk{display:none}
  .hero .in{grid-template-columns:1fr; padding:26px 22px; text-align:center} .hero p{margin-inline:auto} .pay{justify-content:center}
  .wheel{width:min(250px,70%)} .castle{display:none}
}
@media (max-width: 640px){
  .games{grid-template-columns:repeat(2,1fr)} .wallets{grid-template-columns:1fr} .stats{grid-template-columns:1fr 1fr}
  .stats .stat:first-child{grid-column:1 / -1} .logo{font-size:24px} .links .back:not(.lab){display:none}
}
</style>
</head>
<body class="ambient">
<div id="root"></div>
<script type="module">
import React, { useState } from 'react';
import { createRoot } from 'react-dom/client';
import { VelocityMarquee, Reveal } from '../_shared/motion.js';
import { html, GI, Orn, Gem, Logo, Seg, Field, Diamond, SubHead, NavItem, GameRow, GameCard, Stat, Meter, VipCard,
  Crest, Avatar, Tabs, Wallet, CrownWheel, SectionHead, Dust, Guilloche } from './ds/components.js';

// ── данные ──
const GAMES = [
  { name: "Dragon's Hoard", k: 'dragon-head', hue: 30, rtp: '96.4%', badge: 'new' },
  { name: 'Crown Jewels', k: 'cut-diamond', hue: 250, rtp: '97.1%', badge: 'hot' },
  { name: "Knight's Gambit", k: 'chess-knight', hue: 60, rtp: '95.8%' },
  { name: 'Royal Flush', k: 'poker-hand', hue: 160, rtp: '98.2%', badge: 'hot' },
  { name: 'Golden Chalice', k: 'holy-grail', hue: 300, rtp: '96.9%', badge: 'new' },
  { name: "Queen's Garden", k: 'rose', hue: 10, rtp: '96.1%' },
  { name: 'Midnight Joust', k: 'crossed-swords', hue: 270, rtp: '95.5%', badge: 'new' },
  { name: 'Emerald Throne', k: 'throne-king', hue: 150, rtp: '97.6%' },
];
const WINS = [['Lady Morgane', '€1,240', "Dragon's Hoard"], ['Sir Aldric', '€380', 'Royal Flush'], ['Baron K.', '€9,700', 'Crown Jewels'], ['Duchess Ivy', '€615', "Queen's Garden"], ['Lord Ferren', '€2,030', 'Emerald Throne']];
const RUNGS = [['V', 'Baroness'], ['VI', 'Countess'], ['VII', 'Duchess'], ['VIII', 'Princess'], ['IX', 'Queen']];
const PERKS = [{ value: '12%', label: 'Weekly cashback' }, { value: '×2', label: 'Crown points boost' }, { value: 'Royal chest', label: 'Unlocks at Princess', lock: 'LV 8' }];
const COINS = [['₿', 65, '0.0425 BTC', '≈ €2,610'], ['₮', 170, '4,120 USDT', '≈ €3,800'], ['€', 260, '€6,070', 'Main wallet']];

// ── разделы страницы ──
function Top() {
  const [tab, setTab] = useState('casino');
  return html`<header class="top">
    <${Logo}/>
    <${Seg} items=${['sport', 'casino']} value=${tab} onChange=${setTab}/>
    <${Field} placeholder="Search the royal library of games…"/>
    <div class="auth"><a class="lnk" href="#">Sign in</a><${Gem} label="Join" tone="metal" size="sm"/></div>
    <div class="links"><a class="back lab" href="lab/index.html">✦ Lab</a><a class="back" href="/#work">← Elocate</a></div>
  </header>`;
}

function Side() {
  const fresh = GAMES.filter((g) => g.badge === 'new'), hot = GAMES.filter((g) => g.badge === 'hot').concat(GAMES.slice(2, 3));
  return html`<aside class="side"><${Orn} deco>
    <div class="crest-top"><svg width="70" height="18" viewBox="0 0 70 18"><path d="M0 9 H26 M44 9 H70" stroke-width="1"/><path d="M35 1 L41 9 L35 17 L29 9 Z"/></svg></div>
    <nav class="nav">${[['home', 'Main hall'], ['casino', 'Casino', true], ['live', 'Live casino'], ['sports', 'Sports'], ['promo', 'Promotions']].map(([i, l, on]) => html`<${NavItem} key=${l} icon=${i} label=${l} on=${on}/>`)}</nav>
    <${SubHead}>New games<//><div class="glist">${fresh.map((g) => html`<${GameRow} key=${g.name} game=${g} kind="new"/>`)}</div>
    <${SubHead}>Popular<//><div class="glist">${hot.map((g) => html`<${GameRow} key=${g.name} game=${g} kind="hot"/>`)}</div>
    <nav class="nav" style=${{ marginTop: '16px' }}><${NavItem} icon="support" label="Royal support"/></nav>
  <//></aside>`;
}

const Hero = () => html`<${Orn} className="hero" lit sheen deco><${Guilloche}/><svg class="castle" viewBox="0 0 512 512" aria-hidden="true"><path d=${GI.castle}/></svg><div>
    <div class="eyebrow">Welcome to the court</div>
    <h1>100% up to <b class="metal-text">€500</b><br/>+ 200 free spins</h1>
    <p>Claim the throne bonus on your first deposit — and spin the Crown Wheel for one more royal gift.</p>
    <div class="pay"><i style=${{ '--b': 'oklch(45% 0.15 260)' }}>VISA</i><i style=${{ '--b': 'oklch(62% 0.19 40)' }}>MC</i><i style=${{ '--b': 'oklch(55% 0.13 270)' }}>ETH</i><i style=${{ '--b': 'oklch(62% 0.13 170)' }}>₮</i><i style=${{ '--b': 'oklch(72% 0.16 65)' }}>₿</i></div>
    <${Gem} label="Join now" magnetic/>
  </div><${CrownWheel}/><//>`;

const Ticker = () => html`<${VelocityMarquee} className="ticker" baseSpeed=${3.2} renderTrack=${() => WINS.map(([who, amt, g], i) => html`<span key=${i} class="t"><${Diamond}/>${who} won <b>${amt}</b> in ${g}</span>`)}/>`;

function Profile() {
  const [tab, setTab] = useState('dash');
  return html`<${Orn} className="profile" lit deco>
    <${Crest}><${Avatar}/><div class="online">Online</div><//>
    <h3>Lady Morgane</h3><div class="rank">♛ Duchess · VIP level 7</div>
    <${Tabs} items=${[['dash', 'Dashboard'], ['shield', 'Safety'], ['wallet', 'Wallet']]} value=${tab} onChange=${setTab}/>
  <//>`;
}

const Stats = () => html`<div class="stats">
  <${Stat} k="Balance" to=${12480} prefix="€" delta="▲ €1,240 today"/>
  <${Stat} k="Wagered" to=${86300} prefix="€" delta="this season"/>
  <${Stat} k="Crown points" to=${4820} delta="+320 this week"/>
  <${Meter} className="span3" title="Royal multiplier" value=${3.4}/>
  <${VipCard} level=${7} next="Princess" points=${4820} goal=${6000} rungs=${RUNGS} cur=${2} perks=${PERKS}/>
</div>`;

function App() {
  return html`<${React.Fragment}>
    <${Dust}/>
    <div class="app">
      <${Top}/>
      <${Side}/>
      <main class="main">
        <${Reveal}><${Hero}/><//>
        <${Ticker}/>
        <${Reveal}><div class="row"><${Profile}/><${Stats}/></div><//>
        <${Reveal}><${SectionHead} title="Your wallets"/><//>
        <div class="wallets">${COINS.map(([s, h, a, sub]) => html`<${Wallet} key=${s} sym=${s} hue=${h} amount=${a} sub=${sub}/>`)}</div>
        <${Reveal}><${SectionHead} title="Royal games"/><//>
        <div class="games">${GAMES.map((g, i) => html`<${Reveal} key=${g.name} delay=${i * 0.04}><${GameCard} game=${g}/><//>`)}</div>
      </main>
    </div>
    <footer class="foot"><span>Regnum is a fictional brand — UI case study by Elocate Studio.</span><span>Icons: <a href="https://game-icons.net">game-icons.net</a> (Lorc, Delapouite, Skoll) · CC BY 3.0 · Play responsibly · 18+</span></footer>
  <//>`;
}

createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
