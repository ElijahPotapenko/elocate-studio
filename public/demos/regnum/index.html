<!doctype html>
<html lang="en" data-theme="elven">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regnum — royal casino dashboard · Elocate Studio</title>
<meta name="description" content="A royal casino dashboard UI — gamedev case study demo by Elocate Studio. Fictional brand.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "framer-motion": "https://esm.sh/framer-motion@11.11.17?external=react,react-dom",
    "htm": "https://esm.sh/htm@3.1.1"
  }
}
</script>
<!-- тема/подкрутки из лабы — до первой отрисовки, чтобы не мигало -->
<script>try{var L=JSON.parse(localStorage.getItem('regnum-ds-look-v3'));var q=new URLSearchParams(location.search).get('theme');if(q)L={theme:q,vars:{}};if(L){document.documentElement.dataset.theme=L.theme||'elven';for(var k in(L.vars||{}))document.documentElement.style.setProperty(k,L.vars[k]);}}catch(e){}</script>
<link rel="stylesheet" href="ds/tokens.css">
<link rel="stylesheet" href="ds/components.css">
<style>
/* Раскладка СТРАНИЦЫ демо. Все компоненты и цвета — в ds/ (токены → компоненты); тут только сетка и места. */
#root{position:relative; z-index:1}
.app{display:grid; grid-template-columns:268px 1fr; gap:22px; max-width:1360px; margin:0 auto; padding:18px 22px 60px}
.top{grid-column:1 / -1; display:flex; align-items:center; gap:14px}
.games-sec{display:flex; flex-direction:column; gap:16px; scroll-margin-top:20px}
.games-bar{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.games-count{font:var(--t-caption); letter-spacing:var(--tr-caption); color:var(--faint)}
.links{display:flex; gap:14px; white-space:nowrap}
.back{font:var(--t-caption); letter-spacing:var(--tr-caption); color:var(--faint)} .back:hover{color:var(--metal)}
.back.lab{color:var(--metal); text-shadow:0 0 10px var(--glow-metal)}
.side .in{padding:18px 12px}
.main{display:flex; flex-direction:column; gap:22px; min-width:0}
.row{display:grid; grid-template-columns:330px 1fr; gap:22px}
.stats{display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:auto auto 1fr; gap:16px}
.span3{grid-column:1 / -1}
.wallets{display:grid; grid-template-columns:repeat(3,1fr); gap:16px}
.games{display:grid; grid-template-columns:repeat(4,1fr); gap:16px}
footer.foot{position:relative; z-index:1; max-width:1360px; margin:0 auto; padding:0 22px 40px; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; font:var(--t-caption); letter-spacing:var(--tr-caption); color:var(--faint)}
footer.foot a{text-decoration:underline}
@media (max-width: 1100px){ .games{grid-template-columns:repeat(3,1fr)} .row{grid-template-columns:1fr} }
@media (max-width: 900px){
  .app{grid-template-columns:1fr; padding:14px 14px 40px; gap:16px}
  .side{order:2} .main{order:1}
  .top{flex-wrap:wrap; gap:10px} .top .field{order:5; flex-basis:100%} .um-name{display:none} .top .logo{margin-right:auto}
}
@media (max-width: 640px){
  .top .seg{display:none} .bc-k{display:none} .links{display:none} .um-bell{display:none} .top{gap:8px}
  .games{grid-template-columns:repeat(2,1fr)} .wallets{grid-template-columns:1fr} .stats{grid-template-columns:1fr 1fr}
  .stats .stat:first-child{grid-column:1 / -1} .links .back:not(.lab){display:none}
}
</style>
</head>
<body class="ambient">
<div id="root"></div>
<script type="module">
import React, { useState } from 'react';
import { createRoot } from 'react-dom/client';
import { Reveal } from '../_shared/motion.js';
import { html, Orn, Logo, Seg, Field, SubHead, NavItem, GameRow, GameCard, Stat, Meter, VipCard,
  Wallet, SectionHead, Dust, Flourish, WinsTicker, HeroBanner, WheelPanel, ProfileCard, BalanceChip, UserMenu } from './ds/components.js';

// ── данные ──
const GAMES = [
  { name: "Dragon's Hoard", k: 'flame', hue: 30, rtp: '96.4%', badge: 'new', type: 'slots' },
  { name: 'Crown Jewels', k: 'sparkle', hue: 250, rtp: '97.1%', badge: 'hot', type: 'slots' },
  { name: "Knight's Gambit", k: 'horse', hue: 60, rtp: '95.8%', type: 'table' },
  { name: 'Royal Flush', k: 'spade', hue: 160, rtp: '98.2%', badge: 'hot', type: 'table' },
  { name: 'Golden Chalice', k: 'trophy', hue: 300, rtp: '96.9%', badge: 'new', type: 'slots' },
  { name: "Queen's Garden", k: 'flower-lotus', hue: 10, rtp: '96.1%', type: 'slots' },
  { name: 'Midnight Joust', k: 'sword', hue: 270, rtp: '95.5%', badge: 'new', type: 'live' },
  { name: 'Emerald Throne', k: 'crown', hue: 150, rtp: '97.6%', type: 'live' },
];
const WINS = [['Lady Morgane', '€1,240', "Dragon's Hoard"], ['Sir Aldric', '€380', 'Royal Flush'], ['Baron K.', '€9,700', 'Crown Jewels'], ['Duchess Ivy', '€615', "Queen's Garden"], ['Lord Ferren', '€2,030', 'Emerald Throne']];
const RUNGS = [['V', 'Baroness'], ['VI', 'Countess'], ['VII', 'Duchess'], ['VIII', 'Princess'], ['IX', 'Queen']];
const PERKS = [{ value: '12%', label: 'Weekly cashback' }, { value: '×2', label: 'Crown points boost' }, { value: 'Royal chest', label: 'Unlocks at Princess', lock: 'LV 8' }];
const COINS = [['₿', 65, '0.0425 BTC', '≈ €2,610'], ['₮', 170, '4,120 USDT', '≈ €3,800'], ['€', 260, '€6,070', 'Main wallet']];

// ── разделы страницы ──
function Top({ q, setQ }) {
  const [tab, setTab] = useState('casino');
  return html`<header class="top">
    <${Logo}/>
    <${Seg} items=${['sport', 'casino']} value=${tab} onChange=${setTab}/>
    <${Field} placeholder="Search games…" value=${q} onChange=${(v) => { setQ(v); if (v) document.getElementById('games')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); }}/>
    <${BalanceChip} amount="€12,480"/>
    <${UserMenu} name="Lady Morgane" unread=${3}/>
    <div class="links"><a class="back lab" href="lab/index.html">✦ Lab</a><a class="back" href="/#work">← Elocate</a></div>
  </header>`;
}

function Side() {
  const fresh = GAMES.filter((g) => g.badge === 'new'), hot = GAMES.filter((g) => g.badge === 'hot').concat(GAMES.slice(2, 3));
  return html`<aside class="side"><${Orn} deco>
    <${Flourish}/>
    <nav class="nav">${[['home', 'Main hall'], ['casino', 'Casino', true], ['live', 'Live casino'], ['sports', 'Sports'], ['promo', 'Promotions']].map(([i, l, on]) => html`<${NavItem} key=${l} icon=${i} label=${l} on=${on}/>`)}</nav>
    <${SubHead}>New games<//><div class="glist">${fresh.map((g) => html`<${GameRow} key=${g.name} game=${g} kind="new"/>`)}</div>
    <${SubHead}>Popular<//><div class="glist">${hot.map((g) => html`<${GameRow} key=${g.name} game=${g} kind="hot"/>`)}</div>
    <nav class="nav" style=${{ marginTop: '16px' }}><${NavItem} icon="support" label="Royal support"/></nav>
  <//></aside>`;
}

const PAY = [['VISA', 'oklch(45% 0.15 260)'], ['MC', 'oklch(62% 0.19 40)'], ['ETH', 'oklch(55% 0.13 270)'], ['₮', 'oklch(62% 0.13 170)'], ['₿', 'oklch(72% 0.16 65)']];
const PROMO_ENDS = Date.now() + ((2 * 24 + 14) * 3600 + 3 * 60) * 1000;   // акция «уикенда» — 2 дня 14 часов
const Hero = () => html`<${HeroBanner} eyebrow="Weekend reload" endsAt=${PROMO_ENDS} title=${html`50% up to <b class="metal-text">€500</b><br/>+ 100 free spins`}
  text="Your Duchess reload is ready: top up by Sunday and the court doubles half of it — free spins land on Dragon's Hoard." pay=${PAY}
  cta="Claim bonus" secondary="Bonus terms" slides=${3} slide=${0}
  art="assets/hero-elves.webp" artMobile="assets/hero-elves-m.webp" artAlt="The elven king and queen on a golden throne before their forest castle"/>`;

const Profile = () => html`<${ProfileCard} name="Lady Morgane" title="Duchess" level="VIP level 7" facts=${[['2021', 'Member since'], ['1,284', 'Games played'], ['€9.7k', 'Best win']]} tabs=${[['dash', 'Dashboard'], ['shield', 'Safety'], ['wallet', 'Wallet']]}/>`;

const Stats = () => html`<div class="stats">
  <${Stat} k="Balance" to=${12480} prefix="€" delta="▲ €1,240 today"/>
  <${Stat} k="Wagered" to=${86300} prefix="€" delta="this season"/>
  <${Stat} k="Crown points" to=${4820} delta="+320 this week"/>
  <${Meter} className="span3" title="Royal multiplier" value=${3.4}/>
  <${VipCard} level=${7} next="Princess" points=${4820} goal=${6000} rungs=${RUNGS} cur=${2} perks=${PERKS}/>
</div>`;

const TYPES = ['all', 'slots', 'table', 'live'];
function Games({ q, setQ }) {
  const [type, setType] = useState('all');
  const qq = q.trim().toLowerCase();
  const list = GAMES.filter((g) => (type === 'all' || g.type === type) && (!qq || g.name.toLowerCase().includes(qq)));
  return html`<section id="games" class="games-sec">
    <${Reveal}><${SectionHead} title="Royal games"/><//>
    <div class="games-bar"><${Seg} items=${TYPES} value=${type} onChange=${setType}/><span class="games-count">${list.length} of ${GAMES.length}${qq ? html` · “${q.trim()}”` : ''}</span></div>
    <div class="games">${list.length ? list.map((g, i) => html`<${Reveal} key=${g.name} delay=${i * 0.04}><${GameCard} game=${g}/><//>`)
      : html`<div class="empty">No games match “${q.trim()}” in ${type === 'all' ? 'the library' : type}. <a href="#" onClick=${(e) => { e.preventDefault(); setQ(''); setType('all'); }} style=${{ textDecoration: 'underline' }}>Clear filters</a></div>`}</div>
  </section>`;
}

function App() {
  const [q, setQ] = useState('');
  return html`<${React.Fragment}>
    <${Dust}/>
    <div class="app">
      <${Top} q=${q} setQ=${setQ}/>
      <${Side}/>
      <main class="main">
        <${Reveal}><${Hero}/><//>
        <${WinsTicker} wins=${WINS}/>
        <${Reveal}><${WheelPanel} text="One free spin every day. Land a suit, take the prize — free spins, cash, XP boosts and a shot at VIP+."/><//>
        <${Reveal}><div class="row"><${Profile}/><${Stats}/></div><//>
        <${Reveal}><${SectionHead} title="Your wallets"/><//>
        <div class="wallets">${COINS.map(([s, h, a, sub]) => html`<${Wallet} key=${s} sym=${s} hue=${h} amount=${a} sub=${sub}/>`)}</div>
        <${Games} q=${q} setQ=${setQ}/>
      </main>
    </div>
    <footer class="foot"><span>Regnum is a fictional brand — UI case study by Elocate Studio. <a href="lab/index.html">Design system lab</a> · <a href="/#work">Elocate</a></span><span>Icons: <a href="https://phosphoricons.com">Phosphor</a> (MIT) · portraits: Lorelei by Lisa Wischofsky (CC0) · Play responsibly · 18+</span></footer>
  <//>`;
}

createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
